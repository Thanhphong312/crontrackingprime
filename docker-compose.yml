services:
  cron:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --omit=dev --prefer-offline && node src/server.js"
    ports:
      - "3500:3500"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
